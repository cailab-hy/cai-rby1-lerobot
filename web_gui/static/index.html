<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RB-Y1 VLA Control</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ROBOT CONTROL CONSOLE · WEB V2</p>
          <h1>RB-Y1 VLA CONTROL</h1>
        </div>
        <div class="health">
          <span id="cameraSummary" class="chip">Cameras 0/3</span>
          <span id="clientSummary" class="chip">Client stopped</span>
        </div>
      </header>

      <section class="camera-grid" aria-label="Camera previews">
        <article class="camera-card" data-camera="left">
          <div class="camera-heading"><h2>LEFT ARM</h2><span class="camera-dot"></span></div>
          <div class="camera-stage">
            <img src="/camera/left.mjpg" alt="Left arm D405 stream" />
            <div class="camera-overlay">카메라 연결 중</div>
          </div>
          <p class="camera-meta">260322274992</p>
        </article>
        <article class="camera-card" data-camera="front">
          <div class="camera-heading"><h2>HEAD</h2><span class="camera-dot"></span></div>
          <div class="camera-stage">
            <img src="/camera/front.mjpg" alt="Head D405 stream" />
            <div class="camera-overlay">카메라 연결 중</div>
          </div>
          <p class="camera-meta">260322274450</p>
        </article>
        <article class="camera-card" data-camera="right">
          <div class="camera-heading"><h2>RIGHT ARM</h2><span class="camera-dot"></span></div>
          <div class="camera-stage">
            <img src="/camera/right.mjpg" alt="Right arm D405 stream" />
            <div class="camera-overlay">카메라 연결 중</div>
          </div>
          <p class="camera-meta">260322276006</p>
        </article>
      </section>

      <section class="control-panel">
        <div class="field task-field">
          <label>VLA Task <small>실행 전에 작업을 선택하세요</small></label>
          <div id="taskButtons" class="task-buttons" role="group" aria-label="VLA task selection"></div>
          <div id="taskValue" class="task-instruction">Loading…</div>
        </div>
        <div class="field model-field">
          <label>Inference Model</label>
          <div id="modelValue" class="readonly">Loading…</div>
        </div>
        <div class="actions">
          <button id="reconnectButton" class="button secondary">↻ 카메라 다시 연결</button>
          <div class="action-right">
            <button id="startButton" class="button primary">▶ 로봇 클라이언트 실행</button>
            <button id="stopButton" class="button danger" disabled>■ 클라이언트 정지</button>
          </div>
        </div>
      </section>

      <section class="log-panel">
        <div class="section-title"><h2>Client Log</h2><span id="apiMessage"></span></div>
        <pre id="logOutput" aria-live="polite"></pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
